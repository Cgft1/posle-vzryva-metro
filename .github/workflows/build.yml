name: Build Minecraft mod
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install compatible Gradle 8.8
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.8-bin.zip --output /tmp/gradle-8.8-bin.zip
          unzip -q /tmp/gradle-8.8-bin.zip -d /tmp
      - name: Build Forge mod
        run: /tmp/gradle-8.8/bin/gradle --no-daemon build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: posle-vzryva-metro-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
